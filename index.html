<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Janela 3D</title>
  <style>
    :root {
      --bg: #0d0b0a;
      --ink: #f4ede4;
      --muted: #b9ada0;
      --accent: #e8a25c;
      --panel: rgba(20, 16, 13, 0.78);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    canvas { display: block; position: fixed; inset: 0; }
    video { display: none; }

    #intro {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: radial-gradient(ellipse at center, rgba(13,11,10,0.55), rgba(13,11,10,0.92));
      padding: 24px; text-align: center; z-index: 10; overflow-y: auto;
      transition: opacity 0.5s;
    }
    #intro.hidden { opacity: 0; pointer-events: none; }
    #intro h1 { font-weight: 600; font-size: clamp(28px, 5vw, 44px); margin: 0 0 12px; letter-spacing: -0.02em; }
    #intro p { color: var(--muted); max-width: 32em; line-height: 1.5; margin: 0 auto 24px; font-size: 17px; }
    .btn {
      font: inherit; font-size: 18px; font-weight: 600;
      background: var(--accent); color: #1a120a; border: 0; border-radius: 999px;
      padding: 14px 32px; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(244,237,228,0.35); font-size: 15px; padding: 10px 20px; }
    #intro .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    #status {
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 5;
      background: var(--panel); color: var(--muted);
      padding: 8px 16px; border-radius: 999px; font-size: 14px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.6s; white-space: nowrap;
    }
    #status.fade { opacity: 0; }

    #menuBtn {
      position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 6;
      width: 44px; height: 44px; border-radius: 50%; border: 0;
      background: var(--panel); color: var(--ink); font-size: 22px; cursor: pointer;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      opacity: 0.5;
    }
    #menu {
      position: fixed; top: calc(max(16px, env(safe-area-inset-top)) + 54px); right: 16px; z-index: 6;
      width: min(300px, calc(100vw - 32px));
      background: var(--panel); border-radius: 16px; padding: 16px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: none; font-size: 14px;
    }
    #menu.open { display: block; }
    #menu label { display: block; margin: 0 0 12px; color: var(--muted); }
    #menu input[type=range] { width: 100%; accent-color: var(--accent); }
    #menu .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    #menu .check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
    #preview {
      position: fixed; left: 16px; top: max(16px, env(safe-area-inset-top)); z-index: 5;
      width: 160px; border-radius: 12px; transform: scaleX(-1); display: none;
      border: 2px solid rgba(244,237,228,0.3);
    }
    #preview.show { display: block; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="preview" width="160" height="120"></canvas>

  <div id="intro">
    <div>
      <h1>Janela 3D</h1>
      <p>A câmera frontal acompanha a posição do seu rosto e a cena muda de perspectiva, como se a tela fosse uma janela. Nada é gravado nem enviado: tudo roda no próprio aparelho.</p>
      <div class="row">
        <button class="btn" id="startBtn">Começar</button>
        <button class="btn ghost" id="noCamBtn">Sem câmera (usar o dedo)</button>
      </div>
    </div>
  </div>

  <div id="status">Carregando cena…</div>

  <button id="menuBtn" aria-label="Ajustes">⚙︎</button>
  <div id="menu">
    <label>Intensidade do efeito
      <input type="range" id="gain" min="0" max="2" step="0.05" value="0.7">
    </label>
    <label>Profundidade da janela
      <input type="range" id="depth" min="0" max="2" step="0.05" value="0.6">
    </label>
    <label>Suavização
      <input type="range" id="smooth" min="0" max="0.95" step="0.05" value="0.6">
    </label>
    <label class="check"><input type="checkbox" id="invert"> Inverter direção</label>
    <label class="check"><input type="checkbox" id="showCam"> Mostrar câmera</label>
    <div class="row">
      <button class="btn ghost" id="centerBtn">Centralizar</button>
      <button class="btn ghost" id="fsBtn">Tela cheia</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { SplatMesh, SparkRenderer } from "@sparkjsdev/spark";

    // ---------- Configuração da cena ----------
    // Para trocar o fundo, coloque outro .spz/.ply em cenas/ e abra ?cena=nome-do-arquivo.spz
    const params = new URLSearchParams(location.search);
    const SCENE_URL = "./cenas/" + (params.get("cena") || "quarto-pintado.spz");
    const BASE_FOV = Number(params.get("fov") || 70);   // abertura da "janela" com o rosto centralizado

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    let statusTimer;
    function setStatus(text, fadeAfterMs) {
      statusEl.textContent = text;
      statusEl.classList.remove("fade");
      clearTimeout(statusTimer);
      if (fadeAfterMs) statusTimer = setTimeout(() => statusEl.classList.add("fade"), fadeAfterMs);
    }

    // ---------- Three.js + Spark ----------
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0b0a);
    const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.01, 1000);
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const splats = new SplatMesh({ url: SCENE_URL });
    // Arquivos .spz usam o eixo Y para baixo (convenção OpenCV); giramos 180° em X.
    splats.quaternion.set(1, 0, 0, 0);
    scene.add(splats);
    splats.initialized
      .then(() => setStatus(mode ? "Pronto" : "Cena carregada", 2500))
      .catch((e) => { console.error(e); setStatus("Não consegui carregar a cena"); });

    // ---------- Projeção "janela" (off-axis) ----------
    // A tela é um retângulo fixo no mundo. O olho (sua cabeça) se move atrás dele,
    // e o frustum é recalculado para passar exatamente pelas bordas da tela.
    const settings = { gain: 0.7, depth: 0.6, smooth: 0.6, invert: false };
    const head = { x: 0, y: 0, z: 1 };        // posição suavizada (-1..1, z relativo)
    const target = { x: 0, y: 0, z: 1 };      // posição medida

    function updateCamera() {
      const aspect = innerWidth / innerHeight;
      const halfH = 1;                         // meia-altura da tela em unidades do mundo
      const halfW = halfH * aspect;
      const dist0 = halfH / Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2));

      // A tela fica 'depth' unidades à frente do ponto de captura da cena,
      // então mover a cabeça revela o que está ao redor das bordas.
      const scale = 0.25;                      // tamanho do "mundo" da tela em relação à cena
      const ex = head.x * halfW * settings.gain;
      const ey = head.y * halfW * settings.gain;
      const ez = dist0 * head.z;

      // Frustum assimétrico: do olho até as quatro bordas da tela
      const near = 0.01, k = near / (ez * scale);
      camera.projectionMatrix.makePerspective(
        (-halfW - ex) * scale * k, (halfW - ex) * scale * k,
        (halfH - ey) * scale * k, (-halfH - ey) * scale * k,
        near, 1000
      );
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

      // Posição do olho: centro da tela + deslocamento da cabeça
      const screenZ = -settings.depth * dist0 * scale;
      camera.position.set(ex * scale, ey * scale, screenZ + ez * scale);
      camera.quaternion.identity();
      camera.updateMatrixWorld(true);
    }

    // ---------- Entrada: rosto (câmera) ou dedo/mouse ----------
    let mode = null;                           // "face" | "touch"
    let landmarker = null, video = null, lastVideoTime = -1;
    const calib = { x: 0.5, y: 0.5, ipd: 0.12, set: false };
    let lostFrames = 0;

    async function startFace() {
      setStatus("Pedindo acesso à câmera…");
      video = $("cam");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();

      setStatus("Carregando detector de rosto…");
      const { FaceLandmarker, FilesetResolver } = await import("./vendor/mediapipe/vision_bundle.mjs");
      const fileset = await FilesetResolver.forVisionTasks(new URL("./vendor/mediapipe/wasm", location.href).href);
      const opts = (delegate) => ({
        baseOptions: { modelAssetPath: "./modelos/face_landmarker.task", delegate },
        runningMode: "VIDEO",
        numFaces: 1,
      });
      try {
        landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU"));
      } catch (e) {
        console.warn("GPU indisponível, usando CPU", e);
        landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU"));
      }
      mode = "face";
      calib.set = false;
      setStatus("Olhe para a tela e mova a cabeça devagar", 4000);
    }

    function trackFace() {
      if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      const lm = res.faceLandmarks && res.faceLandmarks[0];
      if (!lm) {
        if (++lostFrames === 30) setStatus("Rosto não encontrado", 2000);
        // volta devagar ao centro
        target.x *= 0.97; target.y *= 0.97; target.z += (1 - target.z) * 0.03;
        return;
      }
      lostFrames = 0;
      // Centros das íris (468 e 473) — ponto entre os olhos e distância entre eles
      const a = lm[468], b = lm[473];
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const ipd = Math.hypot((a.x - b.x) * video.videoWidth, (a.y - b.y) * video.videoHeight) / video.videoWidth;
      if (!calib.set) { calib.x = cx; calib.y = cy; calib.ipd = ipd; calib.set = true; }

      // Imagem da câmera frontal não é espelhada: ir para a sua direita = x menor na imagem.
      // Dividir pela distância entre os olhos converte o movimento para "tamanhos de rosto",
      // então o mesmo movimento físico vale igual perto ou longe da tela.
      // (olhos ≈ 6,3 cm; meia-largura do iPad ≈ 12 cm; o fator extra exagera um pouco o efeito)
      const vAspect = video.videoHeight / video.videoWidth;
      const sign = settings.invert ? -1 : 1;
      const toScreen = (6.3 / 12) * 1.5 / ipd;
      target.x = sign * -(cx - calib.x) * toScreen;
      target.y = -(cy - calib.y) * vAspect * toScreen;
      target.z = THREE.MathUtils.clamp(calib.ipd / ipd, 0.4, 2.5);
      drawPreview(lm);
    }

    const previewCanvas = $("preview"), pctx = previewCanvas.getContext("2d");
    function drawPreview(lm) {
      if (!previewCanvas.classList.contains("show")) return;
      pctx.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
      pctx.fillStyle = "#e8a25c";
      for (const i of [468, 473]) {
        pctx.beginPath();
        pctx.arc(lm[i].x * previewCanvas.width, lm[i].y * previewCanvas.height, 3, 0, Math.PI * 2);
        pctx.fill();
      }
    }

    // Dedo/mouse: arrastar move o "olho"
    let dragging = false;
    function pointerToTarget(e) {
      target.x = (e.clientX / innerWidth) * 2 - 1;
      target.y = -((e.clientY / innerHeight) * 2 - 1);
    }
    addEventListener("pointerdown", (e) => {
      if (mode !== "touch" || e.target.closest("#menu, #menuBtn")) return;
      dragging = true; pointerToTarget(e);
    });
    addEventListener("pointermove", (e) => { if (mode === "touch" && (dragging || e.pointerType === "mouse")) pointerToTarget(e); });
    addEventListener("pointerup", () => { dragging = false; });

    // Simulação para testes: ?simular=x,y,z (ex.: ?simular=0.8,0,1)
    if (params.has("simular")) {
      const [x, y, z] = params.get("simular").split(",").map(Number);
      Object.assign(target, { x: x || 0, y: y || 0, z: z || 1 });
      Object.assign(head, target);
      mode = "sim";
      $("intro").classList.add("hidden");
    }

    // ---------- Interface ----------
    $("startBtn").onclick = async () => {
      $("intro").classList.add("hidden");
      try {
        await startFace();
      } catch (e) {
        console.error(e);
        mode = "touch";
        setStatus("Câmera indisponível — arraste o dedo na tela", 5000);
      }
    };
    $("noCamBtn").onclick = () => {
      $("intro").classList.add("hidden");
      mode = "touch";
      setStatus("Arraste o dedo na tela", 3000);
    };
    $("menuBtn").onclick = () => $("menu").classList.toggle("open");
    for (const key of ["gain", "depth", "smooth"]) {
      $(key).oninput = (e) => { settings[key] = Number(e.target.value); };
    }
    $("invert").onchange = (e) => { settings.invert = e.target.checked; };
    $("showCam").onchange = (e) => previewCanvas.classList.toggle("show", e.target.checked);
    $("centerBtn").onclick = () => { calib.set = false; setStatus("Centralizado", 1500); };
    $("fsBtn").onclick = () => {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    };

    addEventListener("resize", () => renderer.setSize(innerWidth, innerHeight));

    // ---------- Loop ----------
    renderer.setAnimationLoop(() => {
      if (mode === "face") trackFace();
      const s = mode === "touch" ? 0.85 : settings.smooth;
      head.x += (target.x - head.x) * (1 - s);
      head.y += (target.y - head.y) * (1 - s);
      head.z += (target.z - head.z) * (1 - s);
      updateCamera();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
